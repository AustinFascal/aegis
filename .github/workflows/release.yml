name: Build & Release Aegis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multiplatform Installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ----------------------------------------------------
      # 1. Setup Android Google Services Configuration
      # ----------------------------------------------------
      - name: Setup Android Google Services
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            echo "Injecting production google-services.json for build..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "615801271453",
              "project_id": "aegis-project-initiative",
              "storage_bucket": "aegis-project-initiative.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:615801271453:android:dc002f9f3871b4b403d074",
                  "android_client_info": {
                    "package_name": "id.cethokaryo.aegis"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyB7SAHIPmTLK7mgf7JngPCxj-OUNMq27fU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # ----------------------------------------------------
      # 1b. Synchronize App Version with Git Release Tag
      # ----------------------------------------------------
      - name: Configure Version from Tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          echo "Configuring Aegis version: ${VERSION_NAME}+${BUILD_NUMBER} from tag ${TAG_NAME}"
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Build Android Release APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_VERSION="${TAG_NAME}"

      - name: Prepare Android Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk aegis-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk aegis-${TAG_NAME}.apk

      # ----------------------------------------------------
      # 2. Build Linux Desktop Application
      # ----------------------------------------------------
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Build Linux Desktop Bundle
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          flutter build linux --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_VERSION="${TAG_NAME}"

      - name: Package Linux Desktop Tarball
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          tar -czf aegis-linux-x64.tar.gz -C build/linux/x64/release bundle --transform='s|^bundle|aegis|'
          cp aegis-linux-x64.tar.gz aegis-${TAG_NAME}-linux-x64.tar.gz

      # ----------------------------------------------------
      # 3. Generate SHA256 Checksums & Release Manifest
      # ----------------------------------------------------
      - name: Generate SHA256 Checksums and Manifest
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          sha256sum aegis-android.apk aegis-linux-x64.tar.gz > checksums.txt
          
          ANDROID_SHA=$(sha256sum aegis-android.apk | awk '{print $1}')
          LINUX_SHA=$(sha256sum aegis-linux-x64.tar.gz | awk '{print $1}')
          ANDROID_SIZE=$(stat -c%s aegis-android.apk)
          LINUX_SIZE=$(stat -c%s aegis-linux-x64.tar.gz)
          
          cat << EOF > release-manifest.json
          {
            "tag_name": "${TAG_NAME}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "assets": {
              "android": {
                "file_name": "aegis-android.apk",
                "sha256": "${ANDROID_SHA}",
                "size_bytes": ${ANDROID_SIZE}
              },
              "linux": {
                "file_name": "aegis-linux-x64.tar.gz",
                "sha256": "${LINUX_SHA}",
                "size_bytes": ${LINUX_SIZE}
              }
            }
          }
          EOF

      # ----------------------------------------------------
      # 4. Publish GitHub Release with Direct Asset Attachments
      # ----------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aegis ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            aegis-android.apk
            aegis-*.apk
            aegis-linux-x64.tar.gz
            aegis-*-linux-x64.tar.gz
            checksums.txt
            release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
