name: Build & Release Aegis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multiplatform Installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ----------------------------------------------------
      # 1. Build Android Universal APK
      # ----------------------------------------------------
      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Android Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk aegis-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk aegis-${TAG_NAME}.apk

      # ----------------------------------------------------
      # 2. Build Linux Desktop Application
      # ----------------------------------------------------
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Package Linux Desktop Tarball
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          tar -czf aegis-linux-x64.tar.gz -C build/linux/x64/release bundle --transform='s|^bundle|aegis|'
          cp aegis-linux-x64.tar.gz aegis-${TAG_NAME}-linux-x64.tar.gz

      # ----------------------------------------------------
      # 3. Publish GitHub Release with Direct Asset Attachments
      # ----------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aegis ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            aegis-android.apk
            aegis-*.apk
            aegis-linux-x64.tar.gz
            aegis-*-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
