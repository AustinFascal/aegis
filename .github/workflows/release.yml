name: Build & Release Aegis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====================================================
  # 1. Build Android & Linux Artifacts (Ubuntu Runner)
  # ====================================================
  build-android-linux:
    name: Build Android APK & Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # Setup Android Google Services
      - name: Setup Android Google Services
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            echo "Injecting production google-services.json for build..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "615801271453",
              "project_id": "aegis-project-initiative",
              "storage_bucket": "aegis-project-initiative.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:615801271453:android:dc002f9f3871b4b403d074",
                  "android_client_info": {
                    "package_name": "id.cethokaryo.aegis"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyB7SAHIPmTLK7mgf7JngPCxj-OUNMq27fU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # Configure Version from Tag
      - name: Configure Version from Tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          echo "Configuring Aegis version: ${VERSION_NAME}+${BUILD_NUMBER} from tag ${TAG_NAME}"
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Build Android Release APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_VERSION="${TAG_NAME}"

      - name: Prepare Android Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk aegis-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk aegis-${TAG_NAME}.apk

      # Build Linux Desktop Application
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Build Linux Desktop Bundle
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          flutter build linux --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_VERSION="${TAG_NAME}"

      - name: Package Linux Desktop Tarball
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          tar -czf aegis-linux-x64.tar.gz -C build/linux/x64/release bundle --transform='s|^bundle|aegis|'
          cp aegis-linux-x64.tar.gz aegis-${TAG_NAME}-linux-x64.tar.gz

      - name: Upload Android & Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-linux
          path: |
            aegis-android.apk
            aegis-*.apk
            aegis-linux-x64.tar.gz
            aegis-*-linux-x64.tar.gz
          retention-days: 1

  # ====================================================
  # 2. Build Windows Desktop Artifacts (Windows Runner)
  # ====================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Version & Build Windows
        shell: pwsh
        run: |
          $TAG_NAME = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $VERSION_NAME = $TAG_NAME.TrimStart("v")
          $BUILD_NUMBER = if ($env:GITHUB_RUN_NUMBER) { $env:GITHUB_RUN_NUMBER } else { "1" }
          
          # Update pubspec.yaml version
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $VERSION_NAME+$BUILD_NUMBER" | Set-Content pubspec.yaml
          
          flutter build windows --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER --dart-define=APP_VERSION=$TAG_NAME

      - name: Package Windows Zip Archive
        shell: pwsh
        run: |
          $TAG_NAME = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "aegis-windows-x64.zip" -Force
          Copy-Item "aegis-windows-x64.zip" -Destination "aegis-$TAG_NAME-windows-x64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            aegis-windows-x64.zip
            aegis-*-windows-x64.zip
          retention-days: 1

  # ====================================================
  # 3. Build macOS Desktop Artifacts (macOS Runner)
  # ====================================================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Version & Build macOS
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          flutter build macos --release --no-codesign --build-name="${VERSION_NAME}" --build-number="${BUILD_NUMBER}" --dart-define=APP_VERSION="${TAG_NAME}"

      - name: Package macOS Universal Zip
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/aegis.app aegis-macos-universal.zip
          cp aegis-macos-universal.zip aegis-${TAG_NAME}-macos-universal.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            aegis-macos-universal.zip
            aegis-*-macos-universal.zip
          retention-days: 1

  # ====================================================
  # 4. Consolidate Checksums & Publish Unified Release
  # ====================================================
  publish-release:
    name: Publish Multiplatform Release
    needs: [build-android-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-android-linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
        continue-on-error: true

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-macos
        continue-on-error: true

      - name: Generate Multiplatform Checksums and Manifest
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          
          # List all artifacts present
          ls -la
          
          # Generate combined checksums.txt
          sha256sum aegis-*.* > checksums.txt
          cat checksums.txt

          # Helper functions to extract sha and size safely
          get_sha() {
            if [ -f "$1" ]; then sha256sum "$1" | awk '{print $1}'; else echo ""; fi
          }
          get_size() {
            if [ -f "$1" ]; then stat -c%s "$1"; else echo "null"; fi
          }

          ANDROID_SHA=$(get_sha aegis-android.apk)
          ANDROID_SIZE=$(get_size aegis-android.apk)

          LINUX_SHA=$(get_sha aegis-linux-x64.tar.gz)
          LINUX_SIZE=$(get_size aegis-linux-x64.tar.gz)

          WIN_SHA=$(get_sha aegis-windows-x64.zip)
          WIN_SIZE=$(get_size aegis-windows-x64.zip)

          MAC_SHA=$(get_sha aegis-macos-universal.zip)
          MAC_SIZE=$(get_size aegis-macos-universal.zip)

          cat << EOF > release-manifest.json
          {
            "tag_name": "${TAG_NAME}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "assets": {
              "android": {
                "file_name": "aegis-android.apk",
                "sha256": "${ANDROID_SHA}",
                "size_bytes": ${ANDROID_SIZE},
                "download_url": "https://github.com/AustinFascal/aegis/releases/download/${TAG_NAME}/aegis-android.apk"
              },
              "linux": {
                "file_name": "aegis-linux-x64.tar.gz",
                "sha256": "${LINUX_SHA}",
                "size_bytes": ${LINUX_SIZE},
                "download_url": "https://github.com/AustinFascal/aegis/releases/download/${TAG_NAME}/aegis-linux-x64.tar.gz"
              },
              "windows": {
                "file_name": "aegis-windows-x64.zip",
                "sha256": "${WIN_SHA}",
                "size_bytes": ${WIN_SIZE},
                "download_url": "https://github.com/AustinFascal/aegis/releases/download/${TAG_NAME}/aegis-windows-x64.zip"
              },
              "macos": {
                "file_name": "aegis-macos-universal.zip",
                "sha256": "${MAC_SHA}",
                "size_bytes": ${MAC_SIZE},
                "download_url": "https://github.com/AustinFascal/aegis/releases/download/${TAG_NAME}/aegis-macos-universal.zip"
              }
            }
          }
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aegis ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            aegis-android.apk
            aegis-*.apk
            aegis-linux-x64.tar.gz
            aegis-*-linux-x64.tar.gz
            aegis-windows-x64.zip
            aegis-*-windows-x64.zip
            aegis-macos-universal.zip
            aegis-*-macos-universal.zip
            checksums.txt
            release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
