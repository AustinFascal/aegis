# ==============================================================================
# Fail2Ban Action Configuration for Aegis Sentinel
# Copy this file to /etc/fail2ban/action.d/aegis.conf on your Linux server
# ==============================================================================

[Definition]

# Action executed on ban: triggers Aegis FCM push dispatcher
actionban = /usr/local/bin/aegis_fcm_dispatcher.sh "<ip>" "<name>" "Banned by Fail2Ban for repeated failures" "<failures>"

# Action executed on unban
actionunban = /usr/local/bin/aegis_fcm_dispatcher.sh "<ip>" "<name>" "Unbanned by Fail2Ban" "0"

[Init]
# Default parameters
name = default
